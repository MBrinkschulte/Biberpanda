<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dff6f3">
    <title>Bezahl-Detektiv</title>
    <style>
        :root {
            --bg-top: #dff7f4;
            --bg-bottom: #fff6d9;
            --card: rgba(255, 255, 255, 0.96);
            --text: #253047;
            --muted: #667085;
            --primary: #6558d3;
            --primary-dark: #4d42b5;
            --yellow: #ffe877;
            --success: #dcfce7;
            --warning: #fff2c7;
            --error: #ffe4e6;
            --neutral: #f5f7fb;
            --line: #e5e9f2;
            --shadow: 0 12px 30px rgba(67, 78, 104, 0.10);

            --gold-light: #fde047;
            --gold-dark: #d9a808;
            --silver-light: #f2f4f7;
            --silver-dark: #bdc5d1;
            --copper-light: #dc832d;
            --copper-dark: #914214;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: var(--bg-bottom);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(255,255,255,.9) 0 90px, transparent 91px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,.55) 0 120px, transparent 121px),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            margin: 0;
            padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            min-height: 100vh;
            touch-action: manipulation;
        }

        button {
            font: inherit;
        }

        .app {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.45rem, 4vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .score-badge {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 54px;
            padding: 10px 18px;
            border: 2px solid rgba(218, 179, 26, .25);
            border-radius: 22px;
            background: var(--yellow);
            box-shadow: 0 5px 0 rgba(210, 169, 0, .18);
            font-size: 1.35rem;
            font-weight: 900;
        }

        .card {
            margin-bottom: 20px;
            padding: clamp(20px, 4vw, 30px);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 30px;
            background: var(--card);
            box-shadow: var(--shadow);
        }

        .difficulty-panel {
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 8px 22px rgba(67, 78, 104, 0.08);
        }

        .difficulty-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .difficulty-btn {
            min-height: 64px;
            padding: 8px 6px;
            border: 3px solid transparent;
            border-radius: 18px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 0 4px 0 #e4e7ee;
            transition: transform .1s ease, box-shadow .1s ease, border-color .1s ease;
        }

        .difficulty-btn span {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: .72rem;
            font-weight: 750;
        }

        .difficulty-btn[aria-pressed="true"] {
            border-color: var(--primary);
            background: #f4f2ff;
            color: var(--primary-dark);
            box-shadow: 0 4px 0 #c9c2ff;
        }

        .difficulty-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e4e7ee;
        }

        .difficulty-btn:focus-visible {
            outline: 4px solid #1f9ee8;
            outline-offset: 3px;
        }

        .task-label {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: .92rem;
            font-weight: 900;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .task-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .task-amount {
            margin: 0;
            font-size: clamp(2.8rem, 10vw, 4.4rem);
            font-variant-numeric: tabular-nums;
            font-weight: 950;
            letter-spacing: -0.055em;
            line-height: 1;
        }

        .customer {
            flex: 0 0 auto;
            font-size: clamp(3rem, 10vw, 4.5rem);
            filter: drop-shadow(0 5px 4px rgba(30, 41, 59, .12));
        }

        .hint-box {
            display: flex;
            align-items: center;
            min-height: 66px;
            margin-bottom: 22px;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 18px;
            background: var(--neutral);
            font-size: clamp(1rem, 3vw, 1.18rem);
            font-weight: 650;
            line-height: 1.4;
        }

        .table-area {
            position: relative;
            min-height: 210px;
            padding: 18px;
            border: 3px dashed #c6b58a;
            border-radius: 24px;
            background:
                linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,.25)),
                repeating-linear-gradient(90deg, #f0dcae 0, #f0dcae 38px, #ead3a0 39px, #ead3a0 40px);
            box-shadow: inset 0 3px 10px rgba(113, 79, 25, .08);
        }

        .table-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 14px;
        }

        .table-title strong {
            font-size: 1.1rem;
        }

        .current-amount {
            color: var(--primary-dark);
            font-size: clamp(1.28rem, 4vw, 1.7rem);
            font-variant-numeric: tabular-nums;
            font-weight: 950;
        }

        .money-on-table {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 12px;
            min-height: 118px;
        }

        .empty-table {
            align-self: center;
            margin: auto;
            color: #766c55;
            font-size: 1.05rem;
            font-weight: 750;
            text-align: center;
        }

        .placed-piece {
            display: grid;
            place-items: center;
            padding: 3px;
            border: 0;
            border-radius: 14px;
            background: rgba(255,255,255,.5);
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
        }

        .placed-piece:active {
            transform: scale(.92);
        }

        .placed-piece:focus-visible,
        .money-btn:focus-visible,
        .action-btn:focus-visible {
            outline: 4px solid #1f9ee8;
            outline-offset: 3px;
        }

        .table-help {
            margin: 12px 0 0;
            color: #675b42;
            font-size: .88rem;
            font-weight: 700;
            text-align: center;
        }

        .table-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .money-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 7px;
            min-width: 0;
            min-height: 112px;
            padding: 9px 4px;
            border: 2px solid var(--line);
            border-radius: 20px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 4px 0 #e7eaf1;
            transition: transform .1s ease, box-shadow .1s ease, border-color .1s ease;
        }

        .money-btn:active {
            transform: translateY(3px) scale(.97);
            box-shadow: 0 1px 0 #e7eaf1;
        }

        .money-label {
            color: var(--muted);
            font-size: .82rem;
            font-weight: 850;
        }

        .piece {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            font-weight: 950;
            line-height: 1;
            box-shadow: 0 4px 7px rgba(0,0,0,.17), inset 0 2px 4px rgba(255,255,255,.48);
            user-select: none;
        }

        .coin {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 1.24rem;
        }

        .coin-2e {
            border: 8px solid var(--silver-dark);
            background: var(--gold-light);
            color: #334155;
        }

        .coin-1e {
            border: 8px solid var(--gold-dark);
            background: var(--silver-light);
            color: #334155;
        }

        .coin-gold {
            border: 3px solid #c68d04;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #6c4306;
        }

        .coin-copper {
            border: 3px solid #76370f;
            background: linear-gradient(135deg, var(--copper-light), var(--copper-dark));
            color: #fff;
        }

        .coin-medium { transform: scale(.90); }
        .coin-small { transform: scale(.80); }

        .bill {
            position: relative;
            width: 86px;
            height: 50px;
            overflow: hidden;
            border-radius: 7px;
            font-size: 1.2rem;
        }

        .bill::before,
        .bill::after {
            content: "";
            position: absolute;
            border: 1px solid currentColor;
            opacity: .2;
        }

        .bill::before { inset: 5px; }
        .bill::after { inset: 10px 22px; border-radius: 50%; }

        .bill span { position: relative; z-index: 1; }
        .bill-100 { border: 2px solid #4f9b62; background: #a7ddb0; color: #245c32; }
        .bill-50 { border: 2px solid #d18b3f; background: #f4c58f; color: #7a4317; }
        .bill-20 { border: 2px solid #35a5d8; background: #8bd8f7; color: #075e8a; }
        .bill-10 { border: 2px solid #e36060; background: #f7abaa; color: #8d1e1e; }
        .bill-5 { border: 2px solid #8e9baa; background: #d7dde5; color: #354052; }

        .placed-piece .coin {
            width: 54px;
            height: 54px;
            font-size: 1.05rem;
        }

        .placed-piece .bill {
            width: 76px;
            height: 44px;
            font-size: 1.05rem;
        }

        .action-btn {
            min-height: 56px;
            padding: 12px 16px;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
        }

        .small-btn {
            border: 2px solid #dfe3eb;
            background: #fff;
            color: var(--muted);
        }

        .small-btn:disabled {
            opacity: .45;
            cursor: default;
        }

        .primary-btn {
            width: 100%;
            min-height: 66px;
            margin-top: 22px;
            border: 0;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 6px 0 var(--primary-dark);
            font-size: 1.28rem;
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .secondary-btn {
            width: 100%;
            min-height: 62px;
            margin-top: 14px;
            border: 3px solid #ddd9ff;
            background: #f8f7ff;
            color: var(--primary-dark);
            font-size: 1.18rem;
        }


        @media (max-width: 620px) {
            body { padding-left: 12px; padding-right: 12px; }
            .difficulty-panel { padding: 10px; }
            .difficulty-options { gap: 7px; }
            .difficulty-btn { min-height: 70px; padding: 7px 3px; font-size: .88rem; }
            .difficulty-btn span { font-size: .64rem; line-height: 1.15; }
            .card { border-radius: 24px; }
            .coins-grid { gap: 9px; }
            .money-btn { min-height: 101px; border-radius: 17px; }
            .coin { width: 57px; height: 57px; font-size: 1.1rem; }
            .bill { width: 72px; height: 45px; font-size: 1.05rem; }
            .money-label { font-size: .75rem; }
        }

        @media (orientation: landscape) and (min-width: 900px) {
            .app { width: min(100%, 1120px); }
            .game-layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 20px;
                align-items: start;
            }
            .game-layout .card { margin-bottom: 0; }
        }


        .confetti-piece {
            position: fixed;
            z-index: 9999;
            width: 10px;
            height: 16px;
            border-radius: 3px;
            left: var(--x);
            top: var(--y);
            opacity: 0;
            pointer-events: none;
            animation: confettiBurst var(--dur) cubic-bezier(.15,.65,.3,1) forwards;
            animation-delay: var(--delay);
        }

        .confetti-piece.round {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .confetti-piece.ribbon {
            width: 6px;
            height: 20px;
            border-radius: 5px;
        }

        @keyframes confettiBurst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(.7);
            }
            28% {
                opacity: 1;
                transform: translate(calc(-50% + var(--dx1)), calc(-50% + var(--dy1))) rotate(var(--r1)) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx2)), calc(-50% + var(--dy2))) rotate(var(--r2)) scale(.9);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="title">🕵️ Bezahl-Detektiv</div>
            <div class="score-badge" aria-label="Punktestand">
                ⭐ <span id="score">0</span>
            </div>
        </header>

        <section class="difficulty-panel" aria-label="Auswahl der Preisstufe">
            <div class="difficulty-options">
                <button class="difficulty-btn" id="levelEasy" type="button" aria-pressed="true" onclick="setDifficulty('easy')">
                    🪙 Billig
                    <span>bis 5 €, centgenau</span>
                </button>
                <button class="difficulty-btn" id="levelMedium" type="button" aria-pressed="false" onclick="setDifficulty('medium')">
                    💶 Teuer
                    <span>bis 30 €, centgenau</span>
                </button>
                <button class="difficulty-btn" id="levelHard" type="button" aria-pressed="false" onclick="setDifficulty('hard')">
                    💎 Sehr teuer
                    <span>bis 1.000 €, centgenau</span>
                </button>
            </div>
        </section>

        <div class="game-layout">
            <section class="card" aria-labelledby="targetAmountDisplay">
                <div class="task-label">Deine Aufgabe</div>
                <div class="task-row">
                    <h1 class="task-amount" id="targetAmountDisplay">0,00 €</h1>
                    <div class="customer" id="customer" aria-hidden="true">🦫</div>
                </div>

                <div class="hint-box" id="hintBox" role="status" aria-live="polite">
                    👀 Lege das Geld passend auf den Tisch.
                </div>

                <div class="table-area">
                    <div class="table-title">
                        <strong>Geld auf dem Tisch</strong>
                        <span class="current-amount" id="currentAmountDisplay">0,00 €</span>
                    </div>

                    <div class="money-on-table" id="moneyOnTable" aria-label="Ausgewähltes Geld"></div>
                    <p class="table-help">Tippe ein Geldstück auf dem Tisch an, um es zurückzulegen.</p>
                </div>

                <div class="table-actions">
                    <button class="action-btn small-btn" id="undoBtn" type="button" onclick="undoLastMoney()">
                        ↩️ Letztes zurück
                    </button>
                    <button class="action-btn small-btn" id="clearBtn" type="button" onclick="clearTable()">
                        🧹 Tisch leeren
                    </button>
                </div>

                <button class="action-btn primary-btn" id="checkBtn" type="button" onclick="checkAnswer()">
                    Bezahlen 💶
                </button>
                <button class="action-btn secondary-btn" id="nextBtn" type="button" onclick="generateTask()" hidden>
                    Nächste Kundschaft ➜
                </button>
            </section>

            <section class="card" aria-labelledby="cashDeskTitle">
                <div class="task-label" id="cashDeskTitle">Kasse 🌈</div>
                <div class="coins-grid" id="cashGrid"></div>
            </section>
        </div>

    </main>

    <script>
        // Alle Beträge werden ausschließlich als ganze Centwerte gespeichert.
        const moneyValues = [
            { cents: 10000, label: '100 Euro', kind: 'bill', className: 'bill-100', face: '100 €' },
            { cents: 5000, label: '50 Euro', kind: 'bill', className: 'bill-50', face: '50 €' },
            { cents: 2000, label: '20 Euro', kind: 'bill', className: 'bill-20', face: '20 €' },
            { cents: 1000, label: '10 Euro', kind: 'bill', className: 'bill-10', face: '10 €' },
            { cents: 500,  label: '5 Euro',  kind: 'bill', className: 'bill-5',  face: '5 €' },
            { cents: 200,  label: '2 Euro',  kind: 'coin', className: 'coin-2e', face: '2 €' },
            { cents: 100,  label: '1 Euro',  kind: 'coin', className: 'coin-1e coin-medium', face: '1 €' },
            { cents: 50,   label: '50 Cent', kind: 'coin', className: 'coin-gold', face: '50' },
            { cents: 20,   label: '20 Cent', kind: 'coin', className: 'coin-gold coin-medium', face: '20' },
            { cents: 10,   label: '10 Cent', kind: 'coin', className: 'coin-gold coin-small', face: '10' },
            { cents: 5,    label: '5 Cent',  kind: 'coin', className: 'coin-copper', face: '5' },
            { cents: 2,    label: '2 Cent',  kind: 'coin', className: 'coin-copper coin-medium', face: '2' },
            { cents: 1,    label: '1 Cent',  kind: 'coin', className: 'coin-copper coin-small', face: '1' }
        ];

        let targetCents = 0;
        let selectedMoney = [];
        let score = 0;
        let inputLocked = false;
        let currentDifficulty = 'easy';

        const euroFormatter = new Intl.NumberFormat('de-DE', {
            style: 'currency',
            currency: 'EUR'
        });

        const difficultyLevels = {
            easy: { min: 1, max: 500, step: 1, name: 'Billig' },
            medium: { min: 1, max: 3000, step: 1, name: 'Teuer' },
            hard: { min: 1, max: 100000, step: 1, name: 'Sehr teuer' }
        };

        function formatMoney(cents) {
            return euroFormatter.format(cents / 100);
        }

        function getCurrentCents() {
            return selectedMoney.reduce((sum, cents) => sum + cents, 0);
        }

        function getMoneyDefinition(cents) {
            return moneyValues.find(item => item.cents === cents);
        }

        function createPieceMarkup(item) {
            if (item.kind === 'bill') {
                return `<div class="piece bill ${item.className}"><span>${item.face}</span></div>`;
            }
            return `<div class="piece coin ${item.className}">${item.face}</div>`;
        }

        function buildCashDesk() {
            const cashGrid = document.getElementById('cashGrid');
            cashGrid.innerHTML = '';

            moneyValues.forEach(item => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'money-btn';
                button.setAttribute('aria-label', `${item.label} auf den Tisch legen`);
                button.innerHTML = `${createPieceMarkup(item)}<span class="money-label">${item.label}</span>`;
                button.addEventListener('click', () => addMoney(item.cents));
                cashGrid.appendChild(button);
            });
        }

        function renderSelectedMoney() {
            const table = document.getElementById('moneyOnTable');
            table.innerHTML = '';

            if (selectedMoney.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-table';
                empty.innerHTML = 'Noch liegt kein Geld hier.<br>Wähle unten Münzen oder Scheine aus.';
                table.appendChild(empty);
                return;
            }

            selectedMoney.forEach((cents, index) => {
                const item = getMoneyDefinition(cents);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'placed-piece';
                button.setAttribute('aria-label', `${item.label} vom Tisch entfernen`);
                button.title = `${item.label} zurücklegen`;
                button.innerHTML = createPieceMarkup(item);
                button.addEventListener('click', () => removeMoneyAt(index));
                table.appendChild(button);
            });
        }

        function updateDisplay() {
            const currentCents = getCurrentCents();
            document.getElementById('currentAmountDisplay').textContent = formatMoney(currentCents);
            document.getElementById('undoBtn').disabled = selectedMoney.length === 0 || inputLocked;
            document.getElementById('clearBtn').disabled = selectedMoney.length === 0 || inputLocked;
            renderSelectedMoney();
        }

        function setHint(message, type = 'neutral') {
            const hintBox = document.getElementById('hintBox');
            const colors = {
                neutral: '#f5f7fb',
                success: '#dcfce7',
                warning: '#fff2c7',
                error: '#ffe4e6'
            };
            hintBox.textContent = message;
            hintBox.style.backgroundColor = colors[type];
        }

        function addMoney(cents) {
            if (inputLocked) return;
            selectedMoney.push(cents);
            updateDisplay();
            setHint('👀 Prüfe den Betrag auf dem Tisch und bezahle, wenn er stimmt.');
        }

        function removeMoneyAt(index) {
            if (inputLocked) return;
            const removed = selectedMoney.splice(index, 1)[0];
            updateDisplay();
            setHint(`↩️ ${getMoneyDefinition(removed).label} wurde zurückgelegt.`);
        }

        function undoLastMoney() {
            if (inputLocked || selectedMoney.length === 0) return;
            const removed = selectedMoney.pop();
            updateDisplay();
            setHint(`↩️ ${getMoneyDefinition(removed).label} wurde zurückgelegt.`);
        }

        function clearTable() {
            if (inputLocked || selectedMoney.length === 0) return;
            selectedMoney = [];
            updateDisplay();
            setHint('🧹 Der Tisch ist wieder leer. Fang noch einmal an.');
        }

        function calculateMinItems(cents) {
            let remaining = cents;
            let count = 0;

            for (const item of moneyValues) {
                count += Math.floor(remaining / item.cents);
                remaining %= item.cents;
            }
            return count;
        }

        function celebrate() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff', '#ff9f1c', '#ff7eb6'];
            const gameArea = document.querySelector('.game-layout').getBoundingClientRect();
            const taskCard = document.querySelector('.game-layout .card').getBoundingClientRect();

            const origins = [
                { x: gameArea.left + gameArea.width * .20, y: gameArea.top + gameArea.height * .25 },
                { x: taskCard.left + taskCard.width * .50, y: taskCard.top + taskCard.height * .24 },
                { x: gameArea.left + gameArea.width * .80, y: gameArea.top + gameArea.height * .28 }
            ];

            for (let i = 0; i < 84; i++) {
                const piece = document.createElement('i');
                piece.className = 'confetti-piece ' + (i % 7 === 0 ? 'round' : (i % 5 === 0 ? 'ribbon' : ''));
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];

                const origin = origins[i % origins.length];
                const originX = origin.x + (Math.random() - .5) * 100;
                const originY = origin.y + (Math.random() - .5) * 55;
                const angle = (-165 + Math.random() * 150) * Math.PI / 180;
                const power = 90 + Math.random() * 190;
                const dx1 = Math.cos(angle) * power;
                const dy1 = Math.sin(angle) * power;
                const dx2 = dx1 * 1.25 + (Math.random() - .5) * 150;
                const dy2 = dy1 + 250 + Math.random() * 330;

                piece.style.setProperty('--x', originX + 'px');
                piece.style.setProperty('--y', originY + 'px');
                piece.style.setProperty('--dx1', dx1 + 'px');
                piece.style.setProperty('--dy1', dy1 + 'px');
                piece.style.setProperty('--dx2', dx2 + 'px');
                piece.style.setProperty('--dy2', dy2 + 'px');
                piece.style.setProperty('--r1', (180 + Math.random() * 540) + 'deg');
                piece.style.setProperty('--r2', (720 + Math.random() * 900) + 'deg');
                piece.style.setProperty('--dur', (1.55 + Math.random() * .95) + 's');
                piece.style.setProperty('--delay', (Math.random() * .16) + 's');

                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2900);
            }
        }

        function checkAnswer() {
            if (inputLocked) return;

            const currentCents = getCurrentCents();

            if (selectedMoney.length === 0) {
                setHint('👆 Lege zuerst Geld auf den Tisch.', 'warning');
                return;
            }

            if (currentCents === targetCents) {
                const minItems = calculateMinItems(targetCents);
                const isOptimal = selectedMoney.length === minItems;

                score++;
                document.getElementById('score').textContent = score;
                inputLocked = true;
                celebrate();

                if (isOptimal) {
                    setHint('🌟 Perfekt! Richtig bezahlt und so wenig Geldstücke wie möglich benutzt.', 'success');
                } else {
                    setHint(`🎉 Richtig bezahlt! Die Profi-Lösung braucht nur ${minItems} Geldstücke.`, 'success');
                }

                document.getElementById('checkBtn').hidden = true;
                document.getElementById('nextBtn').hidden = false;
                updateDisplay();
                return;
            }

            if (currentCents > targetCents) {
                const difference = currentCents - targetCents;
                setHint(`🤔 Das sind ${formatMoney(difference)} zu viel. Lege etwas zurück.`, 'error');
            } else {
                const difference = targetCents - currentCents;
                setHint(`🧮 Es fehlen noch ${formatMoney(difference)}.`, 'warning');
            }
        }

        function setDifficulty(level) {
            if (!difficultyLevels[level]) return;

            currentDifficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(button => {
                button.setAttribute('aria-pressed', 'false');
            });

            const activeButton = {
                easy: document.getElementById('levelEasy'),
                medium: document.getElementById('levelMedium'),
                hard: document.getElementById('levelHard')
            }[level];

            activeButton.setAttribute('aria-pressed', 'true');
            generateTask();
        }

        function createRandomTarget() {
            const level = difficultyLevels[currentDifficulty];
            const numberOfSteps = Math.floor((level.max - level.min) / level.step);
            return level.min + Math.floor(Math.random() * (numberOfSteps + 1)) * level.step;
        }

        function generateTask() {
            targetCents = createRandomTarget();
            selectedMoney = [];
            inputLocked = false;

            const customers = ['🦫', '🐼', '🦊', '🐻', '🐨', '🐰'];
            document.getElementById('customer').textContent =
                customers[Math.floor(Math.random() * customers.length)];

            document.getElementById('targetAmountDisplay').textContent = formatMoney(targetCents);
            document.getElementById('checkBtn').hidden = false;
            document.getElementById('nextBtn').hidden = true;
            setHint(`👀 Stufe ${difficultyLevels[currentDifficulty].name}: Lege das Geld passend auf den Tisch.`);
            updateDisplay();
        }

        buildCashDesk();
        generateTask();
    </script>
</body>
</html>
